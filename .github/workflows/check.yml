name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site (validates data/showcase.json)
        run: python3 build.py
      - name: Check translations
        run: python3 tools/check_i18n.py
