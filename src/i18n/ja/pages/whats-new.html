<!--
title: 更新情報
cta: no
description: PNLCSのリリースノート（新しい順）。
section: リソース
-->
<section class="page-intro">
  <div class="wrap page-intro-grid">
    <div>
    {{crumbs}}
    <h1>PNLCSの更新情報</h1>
    <p class="lede">    <a href="https://github.com/Panelica/pnlcs/blob/main/CHANGELOG.md">GitHubの変更履歴</a>をもとにしたリリースノートを、新しい順に掲載しています。</p>
    <div class="btn-row"><a class="btn btn--light" href="https://github.com/Panelica/pnlcs/releases">タグ付きリリース</a><a class="btn btn--ghost-dark" href="https://docs.pnlcs.com/install/updating/">アップデートの方法</a></div>
    </div>
    <aside class="getbox getbox--light" aria-labelledby="latest-title">
      <h2 id="latest-title">最新情報</h2>
      <table><tbody>
        <tr><th scope="row">日付</th><td>{{latest_date}}</td></tr>
        <tr><th scope="row">変更内容</th><td>{{latest_title}}</td></tr>
        <tr><th scope="row">タグ付きリリース</th><td data-stat="release">v1.2.0</td></tr>
      </tbody></table>
      <a class="getbox-more" href="#{{latest_slug}}">リリースノートを読む</a>
    </aside>
  </div>
</section>

<section class="band">
  <div class="wrap">
{{whats_new}}
  </div>
</section>
