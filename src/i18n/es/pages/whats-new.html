<!--
title: Novedades
cta: no
description: Notas de versión de PNLCS, de la más reciente a la más antigua.
section: Recursos

<section class="page-intro">
  <div class="wrap page-intro-grid">
    <div>
    {{crumbs}}
    <h1>Novedades de PNLCS</h1>
    <p class="lede">Notas de versión, de la más reciente a la más antigua, tomadas del <a href="https://github.com/Panelica/pnlcs/blob/main/CHANGELOG.md">changelog en GitHub</a>.</p>
    <div class="btn-row"><a class="btn btn--light" href="https://github.com/Panelica/pnlcs/releases">Versiones etiquetadas</a><a class="btn btn--ghost-dark" href="https://docs.pnlcs.com/install/updating/">Cómo actualizar</a></div>
    </div>
    <aside class="getbox getbox--light" aria-labelledby="latest-title">
      <h2 id="latest-title">Última actualización</h2>
      <table><tbody>
        <tr><th scope="row">Fecha</th><td>{{latest_date}}</td></tr>
        <tr><th scope="row">Cambio</th><td>{{latest_title}}</td></tr>
        <tr><th scope="row">Versión etiquetada</th><td data-stat="release">v1.2.0</td></tr>
      </tbody></table>
      <a class="getbox-more" href="#{{latest_slug}}">Lee las notas</a>
    </aside>
  </div>
</section>

<section class="band">
  <div class="wrap">
{{whats_new}}
  </div>
</section>
