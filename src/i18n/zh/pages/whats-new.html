<!--
title: 更新动态
cta: no
description: PNLCS 版本发布说明，按时间倒序排列。
section: 资源
-->
<section class="page-intro">
  <div class="wrap page-intro-grid">
    <div>
    {{crumbs}}
    <h1>PNLCS 更新动态</h1>
    <p class="lede">版本发布说明，按时间倒序排列，内容来自 <a href="https://github.com/Panelica/pnlcs/blob/main/CHANGELOG.md">GitHub 上的更新日志</a>。</p>
    <div class="btn-row"><a class="btn btn--light" href="https://github.com/Panelica/pnlcs/releases">已发布版本</a><a class="btn btn--ghost-dark" href="https://docs.pnlcs.com/install/updating/">如何更新</a></div>
    </div>
    <aside class="getbox getbox--light" aria-labelledby="latest-title">
      <h2 id="latest-title">最新更新</h2>
      <table><tbody>
        <tr><th scope="row">日期</th><td>{{latest_date}}</td></tr>
        <tr><th scope="row">变更内容</th><td>{{latest_title}}</td></tr>
        <tr><th scope="row">发布版本</th><td data-stat="release">v1.2.0</td></tr>
      </tbody></table>
      <a class="getbox-more" href="#{{latest_slug}}">查看更新说明</a>
    </aside>
  </div>
</section>

<section class="band">
  <div class="wrap">
{{whats_new}}
  </div>
</section>
