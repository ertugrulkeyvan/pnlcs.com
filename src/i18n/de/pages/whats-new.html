<!--
title: Neuigkeiten
cta: no
description: Versionshinweise zu PNLCS, neueste zuerst.
section: Ressourcen
-->
<section class="page-intro">
  <div class="wrap page-intro-grid">
    <div>
    {{crumbs}}
    <h1>Neuigkeiten in PNLCS</h1>
    <p class="lede">Versionshinweise, neueste zuerst, aus dem <a href="https://github.com/Panelica/pnlcs/blob/main/CHANGELOG.md">Changelog auf GitHub</a>.</p>
    <div class="btn-row"><a class="btn btn--light" href="https://github.com/Panelica/pnlcs/releases">Getaggte Releases</a><a class="btn btn--ghost-dark" href="https://docs.pnlcs.com/install/updating/">Anleitung zum Update</a></div>
    </div>
    <aside class="getbox getbox--light" aria-labelledby="latest-title">
      <h2 id="latest-title">Neuestes Update</h2>
      <table><tbody>
        <tr><th scope="row">Datum</th><td>{{latest_date}}</td></tr>
        <tr><th scope="row">Änderung</th><td>{{latest_title}}</td></tr>
        <tr><th scope="row">Getaggtes Release</th><td data-stat="release">v1.2.0</td></tr>
      </tbody></table>
      <a class="getbox-more" href="#{{latest_slug}}">Versionshinweise lesen</a>
    </aside>
  </div>
</section>

<section class="band">
  <div class="wrap">
{{whats_new}}
  </div>
</section>
