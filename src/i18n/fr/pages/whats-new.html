<!--
title: Nouveautés
cta: no
description: Notes de version de PNLCS, les plus récentes d’abord.
section: Ressources
-->
<section class="page-intro">
  <div class="wrap page-intro-grid">
    <div>
    {{crumbs}}
    <h1>Nouveautés de PNLCS</h1>
    <p class="lede">Notes de version, les plus récentes d’abord, issues du <a href="https://github.com/Panelica/pnlcs/blob/main/CHANGELOG.md">journal des modifications sur GitHub</a>.</p>
    <div class="btn-row"><a class="btn btn--light" href="https://github.com/Panelica/pnlcs/releases">Versions publiées</a><a class="btn btn--ghost-dark" href="https://docs.pnlcs.com/install/updating/">Comment mettre à jour</a></div>
    </div>
    <aside class="getbox getbox--light" aria-labelledby="latest-title">
      <h2 id="latest-title">Dernière mise à jour</h2>
      <table><tbody>
        <tr><th scope="row">Date</th><td>{{latest_date}}</td></tr>
        <tr><th scope="row">Modification</th><td>{{latest_title}}</td></tr>
        <tr><th scope="row">Version publiée</th><td data-stat="release">v1.2.0</td></tr>
      </tbody></table>
      <a class="getbox-more" href="#{{latest_slug}}">Lire les notes de version</a>
    </aside>
  </div>
</section>

<section class="band">
  <div class="wrap">
{{whats_new}}
  </div>
</section>
