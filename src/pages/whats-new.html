<!--
title: What’s new
cta: no
description: PNLCS release notes, newest first.
section: Resources
-->
<section class="page-intro">
  <div class="wrap page-intro-grid">
    <div>
    {{crumbs}}
    <h1>What’s new in PNLCS</h1>
    <p class="lede">Release notes, newest first, from the <a href="https://github.com/Panelica/pnlcs/blob/main/CHANGELOG.md">changelog on GitHub</a>.</p>
    <div class="btn-row"><a class="btn btn--light" href="https://github.com/Panelica/pnlcs/releases">Tagged releases</a><a class="btn btn--ghost-dark" href="https://docs.pnlcs.com/install/updating/">How to update</a></div>
    </div>
    <aside class="getbox getbox--light" aria-labelledby="latest-title">
      <h2 id="latest-title">Latest update</h2>
      <table><tbody>
        <tr><th scope="row">Date</th><td>{{latest_date}}</td></tr>
        <tr><th scope="row">Change</th><td>{{latest_title}}</td></tr>
        <tr><th scope="row">Tagged release</th><td data-stat="release">v1.2.0</td></tr>
      </tbody></table>
      <a class="getbox-more" href="#{{latest_slug}}">Read the notes</a>
    </aside>
  </div>
</section>

<section class="band">
  <div class="wrap">
{{whats_new}}
  </div>
</section>
